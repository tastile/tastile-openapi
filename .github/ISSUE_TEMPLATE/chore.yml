name: Chore / Maintenance
description: regen 基盤、repo hygiene、CI / workflow、license / governance など、振る舞いに影響しない変更を提案する。
title: "[Chore] "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        ## 必須 field (ADR-0009 §D-4)

        着手前に Project v2 で `priority / size / target_release` を埋める。

  - type: input
    id: target_release
    attributes:
      label: target_release
      description: ship したい release (例: v1.0.1)。未定なら空欄。
      placeholder: "v1.0.1"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: priority
      description: ADR-0009 の優先度。
      options:
        - "P0"
        - "P1"
        - "P2"
        - "P3"
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: size
      description: 想定工数。
      options:
        - "S"
        - "M"
        - "L"
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: area (複数選択可)
      description: 該当領域を選択。
      options:
        - label: "spec — openapi.yaml の path / schema / 例"
        - label: "regen — tastile-core の dump_openapi / utoipa 由来"
        - label: "docs — README / CHANGELOG"
        - label: "ci — workflow / validate"
        - label: "other"

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何をするか。regen infra か repo hygiene か CI か。
    validations:
      required: true

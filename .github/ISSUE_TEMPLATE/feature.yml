name: Feature Request
description: 新規 endpoint / 新規 schema / 後方互換 additive 変更を提案する。breaking change は MAJOR bump なので ADR を先に書く。
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## 必須 field (ADR-0009 §D-4)

        着手前に Project v2 で `priority / size / target_release` を埋める。

  - type: input
    id: target_release
    attributes:
      label: target_release
      description: ship したい release (例: v1.1.0)。未定なら空欄。
      placeholder: "v1.1.0"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: priority
      description: ADR-0009 の優先度。
      options:
        - "P0"
        - "P1"
        - "P2"
        - "P3"
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: size
      description: 想定工数。
      options:
        - "S"
        - "M"
        - "L"
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: area (複数選択可)
      description: 該当領域を選択。
      options:
        - label: "spec — openapi.yaml の path / schema / 例"
        - label: "regen — tastile-core の dump_openapi / utoipa 由来"
        - label: "docs — README / CHANGELOG"
        - label: "ci — workflow / validate"
        - label: "other"

  - type: textarea
    id: motivation
    attributes:
      label: 動機・背景
      description: なぜ必要か。consumer 側の use case を 1〜3 行で。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 追加 path / schema / field の概要。breaking change か否かを明示。
    validations:
      required: true

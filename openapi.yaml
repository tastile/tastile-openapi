info:
  contact:
    email: rebuild.up.up@gmail.com
    name: 361do_sleep
  description: v1 API binary per docs/v1/14. Old v0/tastile-api MUST NOT be imported here.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: api
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/executions/{id}/facts:
    post:
      operationId: record_execution_fact
      parameters:
      - description: Execution id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordExecutionFactRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
          description: Command response
        '400':
          description: Validation error (empty fact key)
        '401':
          description: Missing or invalid auth
        '404':
          description: Execution not found or not accessible
        '409':
          description: Execution is void
      summary: Append a fact row to an execution (v1/02 §Execution).
      tags:
      - Execution
  /v1/executions/{id}/finish:
    post:
      operationId: finish_execution
      parameters:
      - description: Execution id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishExecutionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
          description: Command response
        '401':
          description: Missing or invalid auth
        '404':
          description: Execution not found or not accessible
      tags:
      - Execution
  /v1/executions/{id}/pause:
    post:
      operationId: pause_execution
      parameters:
      - description: Execution id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionLifecycleRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
          description: Command response
        '401':
          description: Missing or invalid auth
        '404':
          description: Execution not found or not accessible
        '409':
          description: Execution is not in a pausable state
      tags:
      - Execution
  /v1/executions/{id}/resume:
    post:
      operationId: resume_execution
      parameters:
      - description: Execution id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionLifecycleRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
          description: Command response
        '401':
          description: Missing or invalid auth
        '404':
          description: Execution not found or not accessible
        '409':
          description: Execution is not in a resumable state
      tags:
      - Execution
  /v1/executions/{id}/tasks:
    post:
      operationId: mark_execution_task
      parameters:
      - description: Execution id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkExecutionTaskRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
          description: Command response
        '400':
          description: Validation error (unknown TaskStateKind)
        '401':
          description: Missing or invalid auth
        '404':
          description: Execution not found or not accessible
        '409':
          description: Execution is void
      summary: Append a task-run row to an execution (v1/02 §Execution).
      tags:
      - Execution
  /v1/placements/{id}/executions:
    post:
      operationId: start_execution
      parameters:
      - description: Placement id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:

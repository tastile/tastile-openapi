  /v1/tiles:
    get:
      tags:
      - Read
      summary: 'List tiles (v1 view-model projection).  Per

        docs/superpowers/plans/2026-07-07-v1-tile-list-view-model.md Task 3

        the handler projects `domain::TileListView` so every Tile parameter is

        reachable through the API surface (v1/14 §9).'
      operationId: list_tiles
      parameters:
      - name: owner_ids
        in: query
        description: 'Comma-separated list of owner_ids.  Defaults to the authenticated

          owner (= Personal scope) when omitted.'
        required: false
        schema:
          type: string
        style: form
      - name: limit
        in: query
        description: 'Page size 1..=1000 (default 100); out of range is rejected

          (v1/14 §15-2).  Follow `next_cursor` to reach every row.'
        required: false
        schema:
          type: integer
          format: int64
        style: form
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page (v1/14 §15).
        required: false
        schema:
          type: string
        style: form
      - name: offset
        in: query
        description: 'Retired parameter.  Present only so offset requests are rejected

          instead of silently returning the first page.'
        required: false
        schema:
          type: integer
          format: int64
        style: form
      - name: view_mode
        in: query
        description: 'View bucketing.  `"by_state"` groups tiles by lifecycle.

          Defaults to `"flat"` (no bucketing) for backwards compat with the

          existing TileSummary-only consumers.'
        required: false
        schema:
          type: string
        style: form
      - name: lifecycle
        in: query
        description: 'Optional lifecycle filter.  One of "ready" | "started" | "done"
          |

          "closed"; maps to `TileLifecycleKind` numeric constants via

          `parse_view_filters`.'
        required: false
        schema:
          type: string
        style: form
      - name: range
        in: query
        description: 'Range string for `by_state` projection (e.g. "7d", "30d").  Only

          used when `view_mode = "by_state"`.'
        required: false
        schema:
          type: string
        style: form
      - name: granularity
        in: query
        description: 'Granularity string for `by_state` projection

          (e.g. "no_breaks,min_0m", "important_only").'
        required: false
        schema:
          type: string
        style: form
      - name: search
        in: query
        description: Free-text search across title / description / labels.
        required: false
        schema:
          type: string
        style: form
      - name: exclude_future
        in: query
        description: 'When true, exclude tiles whose first upcoming placement is

          strictly after the current instant.'
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          description: Tile list view-model page (v1/14 §15)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TileListResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/timeline:
    get:
      tags:
      - Read
      summary: Placements intersecting a required time range (v1/14 §4).
      description: 'Returns a bare JSON array of timeline items ordered by

        `span.start ASC, placement_id ASC`.  `include_labels=true` adds

        the non-blocking LABEL (`role = 1`) placements; every other

        `include_*` flag follows the same opt-in rule.  The window may

        span at most 31 days.'
      operationId: get_timeline
      parameters:
      - name: start
        in: query
        description: Range start (RFC 3339); required, must be before `end`
        required: true
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        description: Range end (RFC 3339); required; window at most 31 days
        required: true
        schema:
          type: string
          format: date-time
      - name: parent_placement_id
        in: query
        description: Restrict to placements nested under this parent; returns an empty
          array unless `include_nested=true` is also set
        required: false
        schema:
          type: string
          format: uuid
      - name: include_labels
        in: query
        description: Include LABEL (role = 1) non-blocking periods; default false
        required: false
        schema:
          type: boolean
      - name: include_closed
        in: query
        description: Include CLOSED placements; default false
        required: false
        schema:
          type: boolean
      - name: include_blocked
        in: query
        description: Include BLOCKED placements; default false
        required: false
        schema:
          type: boolean
      - name: include_nested
        in: query
        description: Include placements with a non-null parent; default false
        required: false
        schema:
          type: boolean
      - name: owner_ids
        in: query
        description: Comma-separated owner ids; defaults to the caller
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size; omitted returns the complete in-range set
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: offset
        in: query
        description: Row offset applied independently of `limit`; omitted means offset
          0
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: summary
        in: query
        description: '`month` collapses overlapping relation-derived items into one
          representative per relation component'
        required: false
        schema:
          type: string
      - name: min_duration_ms
        in: query
        description: Hide placements shorter than this effective span
        required: false
        schema:
          type: integer
          format: int64
      - name: min_recurring_step_ms
        in: query
        description: Hide recurring placements whose cadence is at or below this step
        required: false
        schema:
          type: integer
          format: int64
      - name: exclude_source_kinds
        in: query
        description: Comma-separated numeric PlacementSource values to exclude
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Timeline items in range (span.start ASC, placement_id ASC);
            bare JSON array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineItemSchema'
        '400':
          description: Malformed or missing query parameter, `start` not before `end`,
            or window over 31 days
        '401':
          description: Missing or invalid auth
        '403':
          description: Missing `tastile.read` scope, or `owner_ids` names a subject
            the caller cannot read
      x-tastile-required-scope: tastile.read
components:

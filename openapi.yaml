          - 'null'
        date_range_end:
          description: Exclusive ISO-8601 calendar date upper bound.
          type:
          - string
          - 'null'
        date_range_start:
          description: Inclusive ISO-8601 calendar date lower bound.
          type:
          - string
          - 'null'
        ends_at:
          format: date-time
          type:
          - string
          - 'null'
        excluded_dates:
          default: []
          description: ISO-8601 calendar dates skipped by this source. Omitted defaults to no exclusions.
          items:

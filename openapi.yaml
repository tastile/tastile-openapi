    get:
      operationId: list_tiles
      parameters:
      - description: 'Comma-separated list of owner_ids.  Defaults to the authenticated

          owner (= Personal scope) when omitted.'
        in: query
        name: owner_ids
        required: false
        schema:
          type: string
        style: form
      - in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: 'View bucketing.  `"by_state"` groups tiles by lifecycle.

          Defaults to `"flat"` (no bucketing) for backwards compat with the

          existing TileSummary-only consumers.'
        in: query
        name: view_mode
        required: false
        schema:
          type: string
        style: form
      - description: 'Optional lifecycle filter.  One of "ready" | "started" | "done" |

          "closed"; maps to `TileLifecycleKind` numeric constants via

          `parse_view_filters`.'
        in: query
        name: lifecycle
        required: false
        schema:
          type: string
        style: form
      - description: 'Range string for `by_state` projection (e.g. "7d", "30d").  Only

          used when `view_mode = "by_state"`.'
        in: query
        name: range
        required: false
        schema:
          type: string
        style: form
      - description: 'Granularity string for `by_state` projection

          (e.g. "no_breaks,min_0m", "important_only").'
        in: query
        name: granularity
        required: false
        schema:
          type: string
        style: form
      - description: Free-text search across title / description / labels.
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: 'When true, exclude tiles whose first upcoming placement is

          strictly after the current instant.'
        in: query
        name: exclude_future
        required: false
        schema:
          type: boolean
        style: form
      responses:

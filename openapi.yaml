openapi: 3.1.0
info:
  title: api
  description: v1 API binary per docs/v1/14. Old v0/tastile-api MUST NOT be imported
    here.
  contact:
    name: 361do_sleep
    email: rebuild.up.up@gmail.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 1.1.0
paths:
  /v1/access/grants:
    get:
      tags:
      - Access
      summary: Grants visible to the actor (as owner or grantee), newest first.
      operationId: list_access_grants
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Grants visible to the actor (created_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantListResponse'
        '401':
          description: Missing or invalid auth
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/access/grants/pending-for-me:
    get:
      tags:
      - Access
      summary: PENDING grants where the actor is the recipient, newest first.
      operationId: list_pending_access_grants
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Pending grants for the actor (created_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantListResponse'
        '401':
          description: Missing or invalid auth
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/access/grants/{id}/audit:
    get:
      tags:
      - Access
      summary: Audit history of one grant, most recent first.
      operationId: list_access_grant_audit
      parameters:
      - name: id
        in: path
        description: Grant id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Audit events of the grant (occurred_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessAuditListResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Grant not found
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/access/notifications:
    get:
      tags:
      - Access
      summary: 'Notification inbox of the actor, newest first.  `unread_only`

        filters in SQL before pagination.'
      operationId: list_access_notifications
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: unread_only
        in: query
        description: When true, only unread notifications are returned
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Notifications of the actor (created_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessNotificationListResponse'
        '401':
          description: Missing or invalid auth
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/api-tokens:
    get:
      tags:
      - Auth
      summary: API tokens of the caller, newest first.  OwnerAdmin only.
      operationId: list_api_tokens
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: API tokens of the caller (created_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenListResponse'
        '401':
          description: Missing or invalid auth
        '403':
          description: Missing OwnerAdmin permission
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: OwnerAdmin
  /v1/auth/signout:
    post:
      tags:
      - Auth
      operationId: signout
      responses:
        '204':
          description: Credential revoked (or no credential present; idempotent)
      x-tastile-required-scope: none
  /v1/candidates:
    get:
      tags:
      - Read
      summary: Open placements without an active execution (candidates).
      operationId: list_candidates
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Candidate placements of the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateListResponse'
        '401':
          description: Missing or invalid auth
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/endpoints:
    get:
      tags:
      - Read
      summary: 'Delivery destinations (push / web-push / email endpoints) of the

        caller, newest first.'
      operationId: list_endpoints
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Endpoints of the caller (created_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointListResponse'
        '401':
          description: Missing or invalid auth
        '403':
          description: Missing `tastile.read` scope
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/endpoints/{id}/deliveries:
    get:
      tags:
      - Read
      summary: Deliveries routed to one endpoint, most-recent first.
      operationId: list_endpoint_deliveries
      parameters:
      - name: id
        in: path
        description: Endpoint id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: state
        in: query
        description: Optional delivery state filter (0=PENDING / 1=DELIVERED / 2=FAILED)
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Deliveries of the endpoint (created_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Endpoint not found or not owned by the caller
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/executions/{id}/finish:
    post:
      tags:
      - Execution
      operationId: finish_execution
      parameters:
      - name: id
        in: path
        description: Execution id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishExecutionRequest'
        required: true
      responses:
        '200':
          description: Command response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Execution not found or not accessible
      x-tastile-required-scope: tastile.write
  /v1/executions/{id}/pause:
    post:
      tags:
      - Execution
      operationId: pause_execution
      parameters:
      - name: id
        in: path
        description: Execution id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionLifecycleRequest'
        required: true
      responses:
        '200':
          description: Command response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Execution not found or not accessible
        '409':
          description: Execution is not in a pausable state
      x-tastile-required-scope: tastile.write
  /v1/executions/{id}/resume:
    post:
      tags:
      - Execution
      operationId: resume_execution
      parameters:
      - name: id
        in: path
        description: Execution id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionLifecycleRequest'
        required: true
      responses:
        '200':
          description: Command response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Execution not found or not accessible
        '409':
          description: Execution is not in a resumable state
      x-tastile-required-scope: tastile.write
  /v1/labels:
    get:
      tags:
      - Read
      summary: Distinct TIME_WINDOW annotation labels of the caller.
      operationId: list_labels
      parameters:
      - name: owner_ids
        in: query
        description: Comma-separated owner ids; defaults to the caller
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Distinct labels ordered by label ASC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelListResponse'
        '401':
          description: Missing or invalid auth
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/owners/{kind}/{id}:
    delete:
      tags:
      - Owner
      summary: 'Soft-tombstone one owner.  Returns the deletion timestamp and

        the retention window.'
      operationId: delete_owner
      parameters:
      - name: kind
        in: path
        description: 'Owner kind: 0 (USER) only; 1..4 always returns 404 (unsupported)'
        required: true
        schema:
          type: integer
          format: int32
      - name: id
        in: path
        description: Owner id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Owner tombstoned (or already tombstoned; idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDeleteResponseSchema'
        '401':
          description: Missing or invalid auth
        '404':
          description: Owner not found, not accessible, or unsupported kind (1..4)
      x-tastile-required-scope: OwnerAdmin
  /v1/owners/{kind}/{id}/export:
    get:
      tags:
      - Owner
      summary: 'Stream all owner rows as NDJSON (`application/x-ndjson`).

        Permitted for tombstoned owners too (GDPR Art.20 portability).'
      operationId: export_owner
      parameters:
      - name: kind
        in: path
        description: 'Owner kind: 0 (USER) only; 1..4 always returns 404 (unsupported)'
        required: true
        schema:
          type: integer
          format: int32
      - name: id
        in: path
        description: Owner id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'NDJSON body: one JSON object per line, each { table, row }'
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: Missing or invalid auth
        '404':
          description: Owner not found, not accessible, or unsupported kind (1..4)
      x-tastile-required-scope: OwnerAdmin
  /v1/placements:
    get:
      tags:
      - Read
      operationId: list_placements
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Placements of the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementListResponse'
        '401':
          description: Missing or invalid auth
        '422':
          description: Invalid cursor or page limit
      x-tastile-required-scope: tastile.read
  /v1/placements/{id}/executions:
    post:
      tags:
      - Execution
      operationId: start_execution
      parameters:
      - name: id
        in: path
        description: Placement id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExecutionRequest'
        required: true
      responses:
        '200':
          description: Command response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          description: Path id and payload id do not match
        '401':
          description: Missing or invalid auth
        '404':
          description: Placement not found or not accessible
      x-tastile-required-scope: tastile.write
  /v1/prompts:
    post:
      tags:
      - Prompt
      operationId: request_prompt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPromptRequest'
        required: true
      responses:
        '200':
          description: Command response; the new id is in aggregateMeta.promptId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          description: Validation error (unknown kind, subject mismatch)
        '401':
          description: Missing or invalid auth
      x-tastile-required-scope: tastile.write
  /v1/prompts/pending:
    get:
      tags:
      - Prompt
      operationId: list_pending_prompts
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Unresolved, unexpired prompts oldest first (created_at ASC,
            id ASC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptListResponse'
        '401':
          description: Missing or invalid auth
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/prompts/startup-recovery:
    post:
      tags:
      - Prompt
      operationId: respond_startup_recovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartupRecoveryRequest'
        required: true
      responses:
        '200':
          description: Command response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Unknown prompt, or owned by someone else
        '409':
          description: Prompt is already resolved
      x-tastile-required-scope: tastile.write
  /v1/prompts/{prompt_id}/resolve:
    post:
      tags:
      - Prompt
      operationId: resolve_prompt
      parameters:
      - name: prompt_id
        in: path
        description: Prompt id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePromptRequest'
        required: true
      responses:
        '200':
          description: Command response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Unknown prompt, or owned by someone else
        '409':
          description: Prompt is already resolved
      x-tastile-required-scope: tastile.write
  /v1/recurring/{id}/instances:
    get:
      tags:
      - Read
      summary: Frame instances generated for one Recurring definition.
      operationId: list_recurring_instances
      parameters:
      - name: id
        in: path
        description: Recurring id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Frame instances of the recurring (range_start ASC, id ASC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringInstanceListResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Recurring not found or not accessible
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/schedule-definitions:
    post:
      tags:
      - SourceTile
      operationId: publish_schedule_definition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishScheduleDefinitionRequest'
        required: true
      responses:
        '200':
          description: Command response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid auth
      x-tastile-required-scope: tastile.write
  /v1/schedule-reference-catalog:
    get:
      tags:
      - Read
      summary: 'Schedule reference catalog for one `usage`, ordered by

        `span_start ASC, placement_id ASC`.  Always scoped to the

        authenticated owner; there is no owner_id query parameter.'
      operationId: list_schedule_reference_catalog
      parameters:
      - name: usage
        in: query
        description: Required numeric schedule reference usage (1|2|3)
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Catalog items for the usage (span_start ASC, placement_id ASC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleReferenceCatalogListResponse'
        '401':
          description: Missing or invalid auth
        '403':
          description: Missing `tastile.read` scope
        '422':
          description: Missing/invalid usage, or invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/sessions:
    get:
      tags:
      - Read
      summary: Open decision sessions of the caller, newest first.
      operationId: list_sessions
      parameters:
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Open decision sessions (created_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: Missing or invalid auth
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/sessions/{id}/deliveries:
    get:
      tags:
      - Read
      summary: Deliveries of one decision session, most-recent first.
      operationId: list_session_deliveries
      parameters:
      - name: id
        in: path
        description: Decision session id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Page size 1..1000 (default 100); out of range is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque keyset cursor of the previous page
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Retired; any value is rejected
        required: false
        schema:
          type: integer
          format: int64
      - name: state
        in: query
        description: Optional delivery state filter (0=PENDING / 1=DELIVERED / 2=FAILED)
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Deliveries of the session (created_at DESC, id DESC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
        '401':
          description: Missing or invalid auth
        '404':
          description: Session not found or not owned by the caller
        '422':
          description: Invalid cursor, limit, or offset
      x-tastile-required-scope: tastile.read
  /v1/source-tiles:
    get:
      tags:
      - SourceTile
      summary: List SourceTiles owned by the authenticated or queried owner.

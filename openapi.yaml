      - description: SourceTile id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSourceTileRequest'
        description: SourceTile cancel command envelope
        required: true

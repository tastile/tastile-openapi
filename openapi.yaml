components:
  schemas:
    AggregateExprSchema:
      properties:
        kind:
          description: Numeric AggregateFn/TimeScope/TimeSource registry values.
          format: int32
          type: integer
        quantifier:
          format: int32
          type:
          - integer
          - 'null'
        reference:
          format: uuid
          type:
          - string
          - 'null'
        scope:
          format: int32
          type: integer
        source:
          format: int32
          type: integer
      required:
      - kind
      - scope
      - source
      type: object
    AggregateMetaSchema:
      properties:
        change_ids:
          items:
            format: uuid
            type: string
          type: array
        changeset_id:
          format: uuid
          type:
          - string
          - 'null'
        flow_ids:
          items:
            format: uuid
            type: string
          type: array
        frame_rule_id:
          format: uuid
          type:
          - string
          - 'null'
        occurrence_ids:
          items:
            format: uuid
            type: string
          type: array
        placement_ids:
          items:
            format: uuid
            type: string
          type: array
        plan_id:
          format: uuid
          type:
          - string
          - 'null'
        prompt_id:
          description: 'Id of a Prompt created by `RequestPrompt`.  A Prompt is not an

            Aggregate, so it has no `AggregateRef` and no revision; this is the

            only place its id is returned (v1/14 §13-2).'
          format: uuid
          type:
          - string
          - 'null'
        recurring_id:
          format: uuid
          type:
          - string
          - 'null'
        source_tile_id:
          format: uuid
          type:
          - string
          - 'null'
        tile_id:
          format: uuid
          type:
          - string
          - 'null'
        window_ids:
          items:
            format: uuid
            type: string
          type: array
      required:
      - change_ids
      - window_ids
      - flow_ids
      - occurrence_ids
      - placement_ids
      type: object
    AggregateRefSchema:
      properties:
        id:
          format: uuid
          type: string
        kind:
          format: int32
          type: integer
      required:
      - kind
      - id
      type: object
    AnchorSelectorSchema:
      properties:
        pick:
          $ref: '#/components/schemas/PickSchema'
        when:
          $ref: '#/components/schemas/ConditionRefSchema'
      required:
      - when
      - pick
      type: object
    CalendarTermSchema:
      properties:
        date_range:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DateRangeSchema'
        holiday_kind:
          description: Numeric `HolidayKind` registry value.
          format: int32
          type: integer
        offset_min:
          description: 'Fixed offset override; omitted/null inherits the owner timezone.

            Zero explicitly selects UTC.'
          format: int32
          type:
          - integer
          - 'null'
        time_end:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TimeOfDaySchema'
        time_start:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TimeOfDaySchema'
        weekday_mask:
          format: int32
          type: integer
      required:
      - weekday_mask
      - holiday_kind
      type: object
    CancelSourceTilePayloadSchema:
      properties:
        reason:
          description: 'Numeric cancel reason. See `domain::source_tile::state::cancel_reason`

            for the registry values.'
          format: int32
          type: integer
      required:
      - reason
      type: object
    CancelSourceTileRequest:
      properties:
        expected_revision:
          format: int64
          type:
          - integer
          - 'null'
        idempotency_key:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type:
          - string
          - 'null'
        payload:
          $ref: '#/components/schemas/CancelSourceTilePayloadSchema'
      required:
      - idempotency_key
      - payload
      type: object
    CandidateEffectSchema:
      properties:
        change:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChangeRuleSchema'
        idempotency_key:
          format: uuid
          type:
          - string
          - 'null'
        kind:
          description: Numeric `CandidateEffectKind` registry value.
          format: int32
          type: integer
        proposal:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PlacementProposalDraftSchema'
        request:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RequestDraftSchema'
      required:
      - kind
      type: object
    ChangeKeySchema:
      properties:
        group:
          description: Numeric `ChangeGroup` registry value.
          format: int32
          type: integer
        item:
          format: uuid
          type:
          - string
          - 'null'
        part:
          format: int32
          type: integer
      required:
      - group
      - part
      type: object
    ChangeRuleSchema:
      properties:
        id:
          format: uuid
          type: string
        key:
          $ref: '#/components/schemas/ChangeKeySchema'
        kind:
          description: Numeric `ChangeKind` registry value.
          format: int32
          type: integer
        rank:
          format: int32
          type: integer
        source:
          description: Numeric `ChangeSource` registry value.
          format: int32
          type: integer
        source_ref:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChangeSourceRefSchema'
        target:
          $ref: '#/components/schemas/TargetRefSchema'
        value:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChangeValueSchema'
      required:
      - id
      - target
      - kind
      - key
      - source
      - rank
      type: object
    ChangeSourceRefSchema:
      properties:
        decision_run:
          format: uuid
          type:
          - string
          - 'null'
        execution:
          format: uuid
          type:
          - string
          - 'null'
        feedback_txn:
          format: uuid
          type:
          - string
          - 'null'
        flow:
          format: uuid
          type:
          - string
          - 'null'
        frame:
          format: uuid
          type:
          - string
          - 'null'
        recurring:
          format: uuid
          type:
          - string
          - 'null'
      type: object
    ChangeValueSchema:
      oneOf:
      - properties:
          Span:
            $ref: '#/components/schemas/SpanSchema'
        required:
        - Span
        type: object
      - properties:
          Instant:
            format: date-time
            type: string
        required:
        - Instant
        type: object
      - properties:
          Integer:
            format: int64
            type: integer
        required:
        - Integer
        type: object
      - properties:
          Text:
            type: string
        required:
        - Text
        type: object
      - properties:
          Identifier:
            format: uuid
            type: string
        required:
        - Identifier
        type: object
      - properties:
          Inside:
            $ref: '#/components/schemas/InsideSchema'
        required:
        - Inside
        type: object
      - properties:
          RangeInteger:
            $ref: '#/components/schemas/RangeI64Schema'
        required:
        - RangeInteger
        type: object
      - properties:
          RangeInstant:
            $ref: '#/components/schemas/RangeInstantSchema'
        required:
        - RangeInstant
        type: object
      - properties:
          Bool:
            type: boolean
        required:
        - Bool
        type: object
      - properties:
          TimeRequirementRef:
            format: uuid
            type: string
        required:
        - TimeRequirementRef
        type: object
      - properties:
          TaskDefRef:
            format: uuid
            type: string
        required:
        - TaskDefRef
        type: object
      - enum:
        - None
        type: string
    ChooseBranchSchema:
      properties:
        then:
          $ref: '#/components/schemas/ScalarExpressionRefSchema'
        when:
          $ref: '#/components/schemas/ConditionRefSchema'
      required:
      - when
      - then
      type: object
    ChooseExprSchema:
      properties:
        branches:
          items:
            $ref: '#/components/schemas/ChooseBranchSchema'
          type: array
        default:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ScalarExpressionRefSchema'
      required:
      - branches
      type: object
    CommandResponse:
      properties:
        accepted_at:
          format: date-time
          type: string
        aggregate:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AggregateRefSchema'
        aggregate_meta:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AggregateMetaSchema'
        command_id:
          format: uuid
          type: string
        pending:
          items:
            $ref: '#/components/schemas/PendingWorkSchema'
          type: array
        result:
          description: 0 = applied, 1 = already applied, 2 = accepted.
          format: int32
          type: integer
        revision:
          format: int64
          type:
          - integer
          - 'null'
      required:
      - command_id
      - accepted_at
      - result
      - pending
      type: object
    CompanionProposalDefinitionSchema:
      properties:
        proposal_key:
          format: uuid
          type: string
        relation_kind:
          format: int32
          type: integer
        span:
          $ref: '#/components/schemas/SpanSchema'
        target_plan_id:
          format: uuid
          type: string
      required:
      - proposal_key
      - target_plan_id
      - span
      - relation_kind
      type: object
    CompletionResultViewSchema:
      description: View-only mirror of `domain::read::CompletionResultView`.
      properties:
        evaluated_at:
          format: date-time
          type: string
        met:
          type: boolean
        plan_id:
          format: uuid
          type: string
        result_id:
          format: uuid
          type: string
        terms:
          items:
            $ref: '#/components/schemas/CompletionTermResultSchema'
          type: array
        trigger_id:
          format: uuid
          type: string
        trigger_kind:
          description: 0 = EXECUTION_FINISHED, 1 = FEEDBACK_APPLIED, 2 = DECISION_AUTO_APPLIED
          format: int32
          type: integer
      required:
      - result_id
      - plan_id
      - evaluated_at
      - met
      - trigger_kind
      - trigger_id
      - terms
      type: object
    CompletionSchema:
      properties:
        root:
          $ref: '#/components/schemas/ConditionSchema'
        tasks:
          items:
            $ref: '#/components/schemas/TaskDefinitionSchema'
          type: array
        time_requirements:
          items:
            $ref: '#/components/schemas/TimeRequirementSchema'
          type: array
      required:
      - root
      - time_requirements
      - tasks
      type: object
    CompletionTermResultSchema:
      description: View-only mirror of `domain::read::CompletionTermResultView`.
      properties:
        detail:
          type:
          - string
          - 'null'
        met:
          type: boolean
        position_no:
          format: int32
          type: integer
        term_kind:
          format: int32
          type: integer
      required:
      - position_no
      - term_kind
      - met
      type: object
    ConditionRefSchema:
      $ref: '#/components/schemas/ConditionSchema'
    ConditionSchema:
      oneOf:
      - properties:
          All:
            items:
              $ref: '#/components/schemas/ConditionRefSchema'
            type: array
        required:
        - All
        type: object
      - properties:
          Any:
            items:
              $ref: '#/components/schemas/ConditionRefSchema'
            type: array
        required:
        - Any
        type: object
      - properties:
          Not:
            $ref: '#/components/schemas/ConditionRefSchema'
        required:
        - Not
        type: object
      - properties:
          Term:
            $ref: '#/components/schemas/TermSchema'
        required:
        - Term
        type: object
    CreateSourceTilePayloadSchema:
      properties:
        flows:
          items:
            $ref: '#/components/schemas/FlowDefinitionSchema'
          type: array
        horizon:
          $ref: '#/components/schemas/SpanSchema'
        plan:
          $ref: '#/components/schemas/SchedulePlanDefinitionSchema'
        relations:
          items:
            $ref: '#/components/schemas/SourceRelationDefinitionPayloadSchema'
          type:
          - array
          - 'null'
        schedule:
          $ref: '#/components/schemas/SourceScheduleDefinitionSchema'
        source_client_local_id:
          format: uuid
          type:
          - string
          - 'null'
        tile:
          $ref: '#/components/schemas/ScheduleTileDefinitionSchema'
      required:
      - tile
      - plan
      - flows
      - schedule
      - horizon
      type: object
    CreateSourceTileRequest:
      properties:
        expected_revision:
          format: int64
          type:
          - integer
          - 'null'
        idempotency_key:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type:
          - string
          - 'null'
        payload:
          $ref: '#/components/schemas/CreateSourceTilePayloadSchema'
      required:
      - idempotency_key
      - payload
      type: object
    DateRangeSchema:
      properties:
        end:
          format: date
          type: string
        start:
          format: date
          type: string
      required:
      - start
      - end
      type: object
    DecisionCandidateSchema:
      properties:
        effects:
          items:
            $ref: '#/components/schemas/CandidateEffectSchema'
          type: array
        id:
          format: uuid
          type: string
        rank:
          format: int32
          type: integer
        when:
          $ref: '#/components/schemas/ConditionRefSchema'
      required:
      - id
      - when
      - rank
      - effects
      type: object
    DecisionDefSchema:
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/DecisionCandidateSchema'
          type: array
        dialog:
          $ref: '#/components/schemas/InteractionNodeSchema'
        id:
          format: uuid
          type: string
        observe:
          description: Numeric `DecisionObserve` registry value.
          format: int32
          type: integer
        reuse:
          items:
            $ref: '#/components/schemas/FeedbackReuseRuleSchema'
          type: array
        when:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConditionRefSchema'
      required:
      - id
      - observe
      - candidates
      - reuse
      - dialog
      type: object
    EmptyPayloadSchema:
      description: Placeholder for a command whose payload carries no fields.
      type: object
    ExecutionLifecycleRequest:
      description: '`PAUSE_EXECUTION` / `RESUME_EXECUTION` take no payload of their own —

        the execution id comes from the path, so the wire value of `payload`

        is `null` (`CommandRequest<()>`).'
      properties:
        expected_revision:
          format: int64
          type:
          - integer
          - 'null'
        idempotency_key:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type:
          - string
          - 'null'
        payload:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EmptyPayloadSchema'
            description: Always `null`.
      required:
      - idempotency_key
      type: object
    FactComparisonSchema:
      oneOf:
      - properties:
          Equal:
            type: string
        required:
        - Equal
        type: object
      - properties:
          NotEqual:
            type: string
        required:
        - NotEqual
        type: object
      - properties:
          GreaterThan:
            format: int64
            type: integer
        required:
        - GreaterThan
        type: object
      - properties:
          LessThan:
            format: int64
            type: integer
        required:
        - LessThan
        type: object
      - properties:
          InRange:
            $ref: '#/components/schemas/RangeI64Schema'
        required:
        - InRange
        type: object
      - enum:
        - Exists
        type: string
      - enum:
        - Missing
        type: string
    FactTermSchema:
      properties:
        comparison:
          $ref: '#/components/schemas/FactComparisonSchema'
        key:
          type: string
      required:
      - key
      - comparison
      type: object
    FeedbackMappingSchema:
      properties:
        id:
          format: uuid
          type: string
        key:
          $ref: '#/components/schemas/ChangeKeySchema'
        kind:
          description: Numeric `ChangeKind` registry value.
          format: int32
          type: integer
        target:
          $ref: '#/components/schemas/TargetRefSchema'
        value:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChangeValueSchema'
      required:
      - id
      - target
      - key
      - kind
      type: object
    FeedbackReuseRuleSchema:
      properties:
        apply:
          items:
            $ref: '#/components/schemas/FeedbackMappingSchema'
          type: array
        id:
          format: uuid
          type: string
        source:
          $ref: '#/components/schemas/FeedbackSelectorSchema'
        when:
          $ref: '#/components/schemas/ConditionRefSchema'
      required:
      - id
      - when
      - source
      - apply
      type: object
    FeedbackSelectorSchema:
      oneOf:
      - enum:
        - All
        type: string
      - properties:
          Feedback:
            format: uuid
            type: string
        required:
        - Feedback
        type: object
      - properties:
          Within:
            format: int64
            type: integer
        required:
        - Within
        type: object
    FeedbackTermSchema:
      properties:
        feedback_txn:
          format: uuid
          type: string
        state:
          description: Numeric `FeedbackState` newtype value.
          format: int32
          type: integer
      required:
      - feedback_txn
      - state
      type: object
    FinishExecutionPayloadSchema:
      properties:
        kind:
          description: 'Numeric finish kind (v1/02 §Execution 終了情報). Opaque smallint

            until the v1.1 registry publishes the values.'
          format: int32
          type: integer
        note:
          type:
          - string
          - 'null'
      required:
      - kind
      type: object
    FinishExecutionRequest:
      properties:
        expected_revision:
          format: int64
          type:
          - integer
          - 'null'
        idempotency_key:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type:
          - string
          - 'null'
        payload:
          $ref: '#/components/schemas/FinishExecutionPayloadSchema'
      required:
      - idempotency_key
      - payload
      type: object
    FlowDefinitionSchema:
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/ScheduleFlowCandidateDefinitionSchema'
          type: array
        observes:
          items:
            $ref: '#/components/schemas/ScheduleFlowSignalSchema'
          type: array
        when:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConditionRefSchema'
      required:
      - observes
      - candidates
      type: object
    GapAnchorsSchema:
      properties:
        left:
          $ref: '#/components/schemas/AnchorSelectorSchema'
        right:
          $ref: '#/components/schemas/AnchorSelectorSchema'
        size:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RangeI64Schema'
      required:
      - left
      - right
      type: object
    GapTermSchema:
      properties:
        left_anchor:
          $ref: '#/components/schemas/AnchorSelectorSchema'
        right_anchor:
          $ref: '#/components/schemas/AnchorSelectorSchema'
        scope:
          $ref: '#/components/schemas/ScopeSchema'
        size:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RangeI64Schema'
      required:
      - scope
      - left_anchor
      - right_anchor
      type: object
    InsideSchema:
      properties:
        parent:
          format: uuid
          type: string
        scope:
          description: Numeric `ScopeKind` registry value.
          format: int32
          type: integer
      required:
      - parent
      - scope
      type: object
    InteractionInputSchema:
      properties:
        acceptance:
          description: Numeric `InputAcceptance` registry value.
          format: int32
          type: integer
        current:
          items:
            $ref: '#/components/schemas/ChangeValueSchema'
          type: array
        enabled:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConditionRefSchema'
        id:
          format: uuid
          type: string
        options:
          items:
            $ref: '#/components/schemas/InteractionOptionSchema'
          type: array
        visible:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConditionRefSchema'
      required:
      - id
      - current
      - options
      - acceptance
      type: object
    InteractionNodeRefSchema:
      $ref: '#/components/schemas/InteractionNodeSchema'
    InteractionNodeSchema:
      properties:
        children:
          items:
            $ref: '#/components/schemas/InteractionNodeRefSchema'
          type: array
        id:
          format: uuid
          type: string
        inputs:
          items:
            $ref: '#/components/schemas/InteractionInputSchema'
          type: array
        view:
          $ref: '#/components/schemas/InteractionViewSchema'
        visible:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConditionRefSchema'
      required:
      - id
      - view
      - inputs
      - children
      type: object
    InteractionOptionSchema:
      properties:
        id:
          format: uuid
          type: string
        label:
          type: string
        value:
          $ref: '#/components/schemas/ChangeValueSchema'
      required:
      - id
      - label
      - value
      type: object
    InteractionViewSchema:
      properties:
        body:
          type:
          - string
          - 'null'
        title:
          type: string
      required:
      - title
      type: object
    LifeStateSchema:
      enum:
      - Active
      - Paused
      - Closed
      - Voided
      type: string
    LifeTargetSchema:
      oneOf:
      - properties:
          Tile:
            format: uuid
            type: string
        required:
        - Tile
        type: object
      - properties:
          Placement:
            format: uuid
            type: string
        required:
        - Placement
        type: object
      - properties:
          Execution:
            format: uuid
            type: string
        required:
        - Execution
        type: object
      - properties:
          Recurring:
            format: uuid
            type: string
        required:
        - Recurring
        type: object
    LifeTermSchema:
      properties:
        state:
          $ref: '#/components/schemas/LifeStateSchema'
        target:
          $ref: '#/components/schemas/LifeTargetSchema'
      required:
      - target
      - state
      type: object
    MarkExecutionTaskPayloadSchema:
      properties:
        state:
          description: TaskStateKind registry value (0 Visible / 1 Marked / 2 Completed / 3 NotCompleted).
          format: int32
          type: integer
        task_id:
          format: uuid
          type: string
      required:
      - task_id
      - state
      type: object
    MarkExecutionTaskRequest:
      description: '`POST /v1/executions/{id}/tasks` body.'
      properties:
        expected_revision:
          format: int64
          type:
          - integer
          - 'null'
        idempotency_key:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type:
          - string
          - 'null'
        payload:
          $ref: '#/components/schemas/MarkExecutionTaskPayloadSchema'
      required:
      - idempotency_key
      - payload
      type: object
    MetricComparisonSchema:
      oneOf:
      - properties:
          Equal:
            format: int64
            type: integer
        required:
        - Equal
        type: object
      - properties:
          NotEqual:
            format: int64
            type: integer
        required:
        - NotEqual
        type: object
      - properties:
          GreaterThan:
            format: int64
            type: integer
        required:
        - GreaterThan
        type: object
      - properties:
          LessThan:
            format: int64
            type: integer
        required:
        - LessThan
        type: object
      - properties:
          InRange:
            $ref: '#/components/schemas/RangeI64Schema'
        required:
        - InRange
        type: object
      - enum:
        - Exists
        type: string
      - enum:
        - Missing
        type: string
    MetricDefSchema:
      properties:
        expression:
          $ref: '#/components/schemas/ScalarExpressionSchema'
        id:
          format: uuid
          type: string
        limit:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RangeI64Schema'
        output:
          description: Numeric `MetricOutput` registry value.
          format: int32
          type: integer
      required:

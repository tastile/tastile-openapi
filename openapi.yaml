        properties:
          Requirement:
            $ref: '#/components/schemas/RequirementTermSchema'
      - type: object
        required:
        - Task
        properties:
          Task:
            $ref: '#/components/schemas/TaskTermSchema'
      - type: object
        required:
        - Fact
        properties:
          Fact:
            $ref: '#/components/schemas/FactTermSchema'
      - type: object
        required:
        - Metric
        properties:
          Metric:
            $ref: '#/components/schemas/MetricTermSchema'
      - type: object
        required:
        - Feedback
        properties:
          Feedback:
            $ref: '#/components/schemas/FeedbackTermSchema'
      - type: object
        required:
        - Life
        properties:
          Life:
            $ref: '#/components/schemas/LifeTermSchema'
    TileListResponse:
      type: object
      description: 'Mirror of `handlers::paging::ListResponse<TileListView>` for

        `GET /v1/tiles` (v1/14 §15-1).  `count` is the page size, not the

        total; `next_cursor` is null on the last page.'
      required:
      - items
      - count
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/TileListView'
        next_cursor:
          type:
          - string
          - 'null'
    TileListView:
      type: object
      description: Rich tile-list view-model (mirror of `domain::read::TileListView`).
      required:
      - id
      - title
      - lifecycle
      - worked_minutes
      - break_minutes
      - labels
      - objective_mode
      properties:
        break_minutes:
          type: integer
          format: int64
        done_definition:
          type:
          - string
          - 'null'
        done_rule:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
          format: uuid
        labels:
          type: array
          items:
            type: string
        lifecycle:
          type: integer
          format: int32
        next_action:
          type:
          - string
          - 'null'
        objective_mode:
          type: integer
          format: int32
        plan_id:
          type:
          - string
          - 'null'
          format: uuid
        projected_next_start_at:
          type:
          - string
          - 'null'
          format: date-time
        recurrence:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RecurrenceView'
        resume_note:
          type:
          - string
          - 'null'
        source:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SourceTileSummary'
            description: '`Some` for SourceTile rows (see `TileListView` mirror doc).'
        target_rest_min:
          type:
          - integer
          - 'null'
          format: int32
        target_work_min:
          type:
          - integer
          - 'null'
          format: int32
        temporal:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TemporalView'
        title:
          type: string
        worked_minutes:
          type: integer
          format: int64
    TimeObservationSchema:
      type: object
      required:
      - scope
      - source
      - aggregate
      properties:
        aggregate:
          type: integer
          format: int32
        quantifier:
          type:
          - integer
          - 'null'
          format: int32
        reference:
          type:
          - string
          - 'null'
          format: uuid
        scope:
          type: integer
          format: int32
          description: Numeric TimeScope/TimeSource/TimeAggregate registry values.
        source:
          type: integer
          format: int32
    TimeOfDaySchema:
      type: object
      required:
      - hour
      - minute
      - second
      - nanos
      properties:
        hour:
          type: integer
          format: int32
          minimum: 0
        minute:
          type: integer
          format: int32
          minimum: 0
        nanos:
          type: integer
          format: int32
          minimum: 0
        second:
          type: integer
          format: int32
          minimum: 0
    TimeRequirementSchema:
      type: object
      required:
      - id
      - observation
      - required
      properties:
        id:
          type: string
          format: uuid
        observation:
          $ref: '#/components/schemas/TimeObservationSchema'
        preferred:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RangeI64Schema'
        required:
          $ref: '#/components/schemas/RangeI64Schema'
    TimelineChangeKeySchema:
      type: object
      description: 'Mirror of `domain::change_set::ChangeKey` inside a resolution

        violation.  `group` is the numeric `ChangeGroup` constant.'
      required:
      - group
      - part
      properties:
        group:
          type: integer
          format: int32
        item:
          type:
          - string
          - 'null'
          format: uuid
        part:
          type: integer
          format: int32
    TimelineContentSchema:
      type: object
      description: Mirror of `domain::read::TileContentView`.
      required:
      - title
      properties:
        description:
          type:
          - string
          - 'null'
        title:
          type: string
    TimelineInsideSchema:
      type: object
      description: 'Mirror of `domain::read::InsideView`.  `scope` is the numeric

        `ScopeKind` constant (0 ROOT / 1 HOST / 2 GAP).'
      required:
      - parent
      - scope
      properties:
        parent:
          type: string
          format: uuid
        scope:
          type: integer
          format: int32
    TimelineItemSchema:
      type: object
      description: 'Mirror of `handlers::timeline::TimelineItemRead`: the flattened

        `domain::read::TimelineItem` plus the source-tile lineage fields.


        `role` is the numeric `PlanRole` constant.  `role = 1` (LABEL)

        placements are the non-blocking label periods of v1/14 §4: they are

        excluded unless `include_labels=true` and must be rendered in a

        separate lane — they never count as busy time for placement or

        conflict purposes.'
      required:
      - placement_id
      - revision
      - tile_id
      - content
      - visual
      - role
      - span
      - source
      - resolution
      properties:
        content:
          $ref: '#/components/schemas/TimelineContentSchema'
        inside:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TimelineInsideSchema'
        occurrence_id:
          type:
          - string
          - 'null'
          format: uuid
        owner:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TimelineOwnerEmbedSchema'
            description: Owner profile embed; omitted when the profile lookup misses.
        placement_id:
          type: string
          format: uuid
        resolution:
          $ref: '#/components/schemas/TimelineResolutionSchema'
        revision:
          type: integer
          format: int64
        role:
          type: integer
          format: int32
          description: Numeric `PlanRole` constant (0 EXECUTABLE / 1 LABEL).
        source:
          $ref: '#/components/schemas/TimelineSourceSchema'
        source_tile_id:
          type:
          - string
          - 'null'
          format: uuid
        span:
          $ref: '#/components/schemas/TimelineSpanSchema'
        split_count:
          type:
          - integer
          - 'null'
          format: int32
        split_group_id:
          type:
          - string
          - 'null'
          format: uuid
        split_index:
          type:
          - integer
          - 'null'
          format: int32
        tile_id:
          type: string
          format: uuid
        visual:
          $ref: '#/components/schemas/TimelineVisualSchema'
    TimelineOwnerEmbedSchema:
      type: object
      description: 'Mirror of `domain::read::TimelineOwnerEmbed` (v1/15 §4).  The
        wire

        field is literally `ref_` because the domain struct uses that

        identifier; clients must read `ref_`, not `ref`.'
      required:
      - ref_
      - profile
      properties:
        profile:
          $ref: '#/components/schemas/TimelineOwnerProfileSchema'
        ref_:
          $ref: '#/components/schemas/TimelineOwnerRefSchema'
    TimelineOwnerProfileSchema:
      type: object
      description: Mirror of `domain::read::OwnerProfileView`.
      required:
      - display_name
      properties:
        avatar_url:
          type:
          - string
          - 'null'
        display_name:
          type: string
    TimelineOwnerRefSchema:
      type: object
      description: Mirror of `domain::read::OwnerRef` inside the owner embed.
      required:
      - kind
      - id
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: integer
          format: int32
    TimelineResolutionSchema:
      type: object
      description: 'Mirror of `domain::read::ResolutionInfo`.  `state` is the numeric

        `ResolutionState` constant (0 OPEN / 1 CLOSED / 2 BLOCKED).'
      required:
      - state
      - resolved_at
      - resolution_hash
      - violations
      properties:
        resolution_hash:
          type: string
          format: uuid
        resolved_at:
          type: string
          format: date-time
        state:
          type: integer
          format: int32
        violations:
          type: array
          items:
            $ref: '#/components/schemas/TimelineViolationSchema'
    TimelineSourceSchema:
      type: object
      description: 'Mirror of `domain::read::PlacementSourceView`.  `kind` is the
        numeric

        `PlacementSource` constant (0 MANUAL / 1 RECURRING / 2 FLOW / 3 IMPORT /

        4 SOURCE); `detail` is an opaque diagnostic string.'
      required:
      - kind
      - detail
      properties:
        detail:
          type: string
        kind:
          type: integer
          format: int32
    TimelineSpanSchema:
      type: object
      description: Mirror of `domain::read::Span` inside a timeline item.
      required:
      - start
      - end
      properties:
        end:
          type: string
          format: date-time
        start:
          type: string
          format: date-time
    TimelineViolationSchema:
      type: object
      description: Mirror of `domain::resolver::ResolutionViolation`.
      required:
      - id
      - kind
      properties:
        id:
          type: string
          format: uuid
        key:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TimelineChangeKeySchema'
        kind:
          type: integer
          format: int32
          description: Numeric `ViolationKind` constant.
        related_id:
          type:
          - string
          - 'null'
          format: uuid
    TimelineVisualSchema:
      type: object
      description: Mirror of `domain::read::TileVisualView`.
      properties:
        color:
          type:
          - string
          - 'null'
        icon:
          type:
          - string
          - 'null'
    UnplacedOccurrenceSchema:
      type: object
      description: 'One Source occurrence the placement algorithm could not place.

        `reason`: 0 = INSUFFICIENT_CAPACITY, 1 = LIMIT_CONFLICT,

        2 = PRIORITY_TIE_CONFLICT (v1/10 §2 — numeric constants only).'
      required:
      - occurrence_id
      - reason
      - required_duration_ms
      - available_duration_ms
      - blocked_at
      properties:
        available_duration_ms:
          type: integer
          format: int64
        blocked_at:
          type: string
          format: date-time
        conflicting_source_tile_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The peer Source that won the contested slot, when the reason
            is a

            same-priority contest.'
        occurrence_id:
          type: string
          format: uuid
        reason:
          type: integer
          format: int32
        required_duration_ms:
          type: integer
          format: int64
    UpdateSourceTilePayloadSchema:
      type: object
      required:
      - tile
      - plan
      - flows
      - schedule
      - horizon
      properties:
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowDefinitionSchema'
        horizon:
          $ref: '#/components/schemas/SpanSchema'
        plan:
          $ref: '#/components/schemas/SchedulePlanDefinitionSchema'
        relations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SourceRelationDefinitionPayloadSchema'
        schedule:
          $ref: '#/components/schemas/SourceScheduleDefinitionSchema'
        source_client_local_id:
          type:
          - string
          - 'null'
          format: uuid
        tile:
          $ref: '#/components/schemas/ScheduleTileDefinitionSchema'
    UpdateSourceTileRequest:
      type: object
      required:
      - idempotency_key
      - payload
      properties:
        expected_revision:
          type:
          - integer
          - 'null'
          format: int64
        idempotency_key:
          type: string
          format: uuid
        occurred_at:
          type:
          - string
          - 'null'
          format: date-time
        payload:
          $ref: '#/components/schemas/UpdateSourceTilePayloadSchema'

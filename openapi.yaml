        pick:
          $ref: '#/components/schemas/PickSchema'
        when:
          $ref: '#/components/schemas/ConditionRefSchema'
    ApiTokenCreateRequestSchema:
      type: object
      description: '`POST /v1/api-tokens` request body (ADR-0010 §D-1.1 + Issue #153
        §A.1/A.2).

        `expires_at` is required at the wire level — server-side validation

        rejects `null` / omitted with `ApiErrorKind::VALIDATION`.  `scopes`

        follows the canonical order produced by `ScopeSet::as_canonical_string`

        (`all` → `tastile.read` → `tastile.write`) so the on-the-wire shape is

        deterministic regardless of the order the caller supplied.'
      required:
      - label
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
        label:
          type: string
        scopes:
          type:
          - string
          - 'null'
          description: 'Canonical form: `"all"` (legacy wildcard), `"tastile.read"`,

            `"tastile.write"`, or `"tastile.read tastile.write"`.

            Unknown tokens / `all`-coexistence are rejected with 400

            `invalid_scope`.  Independent-scope model: omitting `scopes`

            while authenticated as a `BearerToken` returns 400

            `scopes_required`.'
    ApiTokenListResponse:
      type: object
      description: Mirror of `handlers::paging::ListResponse<ApiTokenView>`.
      required:
      - items
      - count
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiTokenViewSchema'
        next_cursor:
          type:
          - string
          - 'null'
    ApiTokenViewSchema:
      type: object
      description: 'Mirror of `handlers::auth::ApiTokenView` for `GET /v1/api-tokens`.

        `scopes` is the space-separated scope list stored on the token.'
      required:
      - id
      - label
      - prefix
      - scopes
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        label:
          type: string
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        prefix:
          type: string
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        scopes:
          type: string
    CalendarTermSchema:
      type: object
      required:
      - weekday_mask
      - holiday_kind
      properties:
        date_range:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DateRangeSchema'
        holiday_kind:
          type: integer
          format: int32
          description: Numeric `HolidayKind` registry value.
        offset_min:
          type:
          - integer

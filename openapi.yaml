  description: SourceTile -> Occurrence -> PlacementTile scheduling (production core)
- name: Execution
  description: 'Execution lifecycle: start / pause / resume / finish (v1/14 §2.5)'
- name: Prompt
  description: Server-issued prompt inbox (v1/14 §13)
- name: Access
  description: Multi-user access grants, audit, and notifications (v1/14 §9)
